services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calling_agent
      POSTGRES_PASSWORD: calling_agent
      POSTGRES_DB: calling_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calling_agent"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
